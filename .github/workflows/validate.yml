name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python plugins/pkos/skills/codex-company-swarm/scripts/audit_prompt_budget.py
      - run: python plugins/pkos/skills/codex-company-swarm/scripts/validate_install.py
      - run: python -m unittest discover -s plugins/pkos/skills/codex-company-swarm/tests -v
